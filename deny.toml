# cargo-deny configuration. Read by GUARD-LIBRARY-LICENCE-COMPATIBILITY, which
# enforces [[RFC-0001:C-LICENSE]] (4): no library crate may depend, directly or
# transitively, on a component whose licence imposes obligations beyond
# `Apache-2.0 OR MIT`.
#
# Why a tool rather than review: a copyleft dependency beneath a library crate
# makes that crate's declared licence FALSE without breaking anything. Builds
# succeed and the problem surfaces when an adopter's lawyer reads the tree. The
# violation is usually introduced transitively by a minor version bump, which is
# exactly the change that gets no scrutiny.

[licenses]
# Permissive only. Deliberately does NOT include AGPL-3.0-or-later: the
# application carries that licence, but nothing beneath a library crate may.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.93

# An unlicensed or unrecognised dependency is a failure, not a warning — an
# unknown licence cannot be shown to satisfy RFC-0001:C-LICENSE (4).
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
# Query engines are banned outright beneath the library crates by
# [[RFC-0006:C-LAYERING]] (1). GUARD-NO-QUERY-ENGINE-UNDER-CORE checks the graph
# per crate; these entries make the intent fail fast at dependency-add time.
deny = [
    { name = "datafusion", reason = "RFC-0006:C-LAYERING 1 — no general-purpose SQL query engine beneath the library crates. SQL belongs in a separate optional component." },
    { name = "sqlparser", reason = "RFC-0006:C-LAYERING 1 — arrives with a query engine; SQL is deferred past the first release." },
]

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
