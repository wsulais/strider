#:schema ../schema/adr.schema.json

[govctl]
id = "ADR-0013"
title = "Adaptive partitions for the screen only"
status = "accepted"
date = "2026-07-29"
refs = [
    "RFC-0002:C-EXEC",
    "RFC-0003:C-COMMIT",
    "RFC-0003:C-PARTITIONING",
    "RFC-0003:C-PREVIEW",
    "RFC-0005:C-BINDING",
    "RFC-0007:C-EXTRACT",
    "RFC-0007:C-INVALIDATION",
    "RFC-0007:C-PROVENANCE",
]

[content]
context = """
Adaptive node sizing was raised early as something nobody had explored. COPC nodes are fixed when the file is
written, but interactive workloads are not — so the runtime cache could merge nodes while a user orbits one
tree, or subdivide them when an algorithm wants finer neighbourhoods, becoming its own spatial index.

Assessed against the specification as it stands, three obligations oppose it for committed evaluation.
[[RFC-0003:C-COMMIT]] 3 requires reductions to combine in a fixed total order derived from partition
identity, and adaptive partitions have none that is stable — the order would become camera-dependent, and
bit-identity would fail. [[RFC-0003:C-COMMIT]] 4 requires the partition size to be recorded, and adaptive
sizing leaves no single size to record. [[RFC-0005:C-BINDING]] 5 requires a derived artefact to carry the
fingerprint it was built from, while an adaptively merged cache entry derives from a set of nodes plus a
merge decision, making its key interaction state rather than content.

A fourth cost appears in [[RFC-0007:C-INVALIDATION]]: determining which partitions an edit invalidates is
bounded by that edit's own extent over stable partitions, but over adapted ones an edit can invalidate a
merged entity spanning regions it never touched.

The motivating case for *subdivision* also turned out to be already solved. "An algorithm needs finer
neighbourhoods" is exactly what a declared halo width and a satisfying planner provide
([[RFC-0002:C-EXEC]] 1), deterministically and with partition identity preserved. Cache-driven subdivision
would be a second, non-deterministic mechanism for a problem that already has a deterministic one.

None of that argues against adaptation for *rendering*, where it is genuinely desirable. Render state is
derived and never authoritative ([[RFC-0007:C-EXTRACT]] 1 and 2), and previews are already released from
reproducibility ([[RFC-0003:C-PREVIEW]] 2), so nothing repeatable depends on the shape of a render partition."""
decision = """
Partitioning may adapt for preview and rendering, and may not for committed runs. The obligations are written
in [[RFC-0003:C-PARTITIONING]]; this ADR records only *why*.

Why adaptation is **confined to the render path**:

- **Committed determinism depends on partition identity.** [[RFC-0003:C-COMMIT]] 3 fixes reduction order by
  partition identity, and an adaptive partition has none that is stable — order would become camera-dependent
  and bit-identity would fail. [[RFC-0003:C-COMMIT]] 4's recorded partition size likewise has no single value
  under adaptation, and [[RFC-0005:C-BINDING]] 5's fingerprinted derived artefacts become keyed on
  interaction state rather than content.
- **It is desirable on the render side, not merely permitted.** Render state is derived and never
  authoritative, and previews are already released from reproducibility, so nothing repeatable depends on a
  render partition's shape. This is the same authority split applied everywhere else in this specification.
- **The subdivision case was already solved.** Finer neighbourhoods are what a declared halo width and a
  satisfying planner deliver, deterministically. Cache-driven subdivision would duplicate that
  non-deterministically.
- **Recording the adaptation was considered and rejected.** A result reproducible only by replaying a recorded
  partitioning is not reproducible from its inputs, so an independent party running the same pipeline as
  specified would get different bytes — which is what bit-identity exists to exclude."""
consequences = """
### Positive

Interaction gets the cache behaviour that helps it, without any risk to a delivered result. Committed
partitioning stays a pure function of the source index and declared requirements, which is what makes
bit-identity achievable at all.

### Negative

Two partitioning regimes exist and must not leak into one another, which is a boundary the implementation
has to hold rather than a property it gets. Committed runs forgo a genuine speed-up from adapting to access
patterns, accepted deliberately.

### Neutral

Two drifts to watch. First, an adapted partitioning being reused for a committed run because it is already
warm: the predictable regression, since adaptive partitioning makes committed runs faster and the
degradation from bit-identity to approximate reproducibility is silent, with every tolerance-based test
continuing to pass. [[RFC-0003:C-PARTITIONING]] 1 forbids the reuse for that reason. Second, cache-driven
subdivision reappearing as a way to satisfy a neighbourhood requirement, which would put a
non-deterministic mechanism alongside the deterministic one the planner already provides.

Reversal cost is low in one direction and high in the other. Extending adaptation to committed runs later
would forfeit bit-identity and invalidate the reproducibility of everything produced before and after.
Withdrawing render-side adaptation would cost only performance."""

[[content.alternatives]]
text = "Adaptive partitioning permitted for preview and rendering, forbidden for committed runs"
status = "accepted"
pros = [
    "Interaction gets the cache behaviour that actually helps it, where nothing reproducible depends on partition shape",
    "Bit-identity survives, because committed partitioning stays derived from the index and declared requirements alone",
    "Consistent with the authority split used throughout: latitude on the derived side, strictness on the authoritative side",
]
cons = [
    "Two partitioning regimes to implement and to keep from leaking into one another",
    "Committed runs forgo a real speed-up available from adapting to access patterns",
]

[[content.alternatives]]
text = "Adaptive partitioning everywhere, including committed runs"
status = "rejected"
pros = [
    "Largest performance win, applied where the heaviest work happens",
    "One partitioning mechanism, one cache, no regime boundary",
    "The runtime cache becomes a genuinely better index than the file's fixed one",
]
cons = [
    "Partition identity becomes interaction-dependent, so [[RFC-0003:C-COMMIT]] 3's fixed reduction order is unavailable",
    "No single partition size to record, so [[RFC-0003:C-COMMIT]] 4 cannot be satisfied",
    "Cache keys become interaction state rather than content, against [[RFC-0005:C-BINDING]] 5",
    "Edit invalidation can span regions the edit never touched",
]
rejection_reason = "It trades bit-identical committed results for throughput, and bit-identity is what makes the provenance guarantee in [[RFC-0007:C-PROVENANCE]] mean anything. The degradation would also be silent: results would remain approximately reproducible, so every test written against a tolerance would keep passing while the guarantee had already gone."

[[content.alternatives]]
text = "Adaptive partitioning everywhere, with the chosen partitioning recorded as a manifest so committed runs stay reproducible by replaying it"
status = "rejected"
pros = [
    "Keeps the performance win while making a committed run repeatable",
    "Honest in principle: the configuration that produced a result is recorded, as [[RFC-0003:C-COMMIT]] 4 already demands",
]
cons = [
    "The manifest is proportional to partition count, so it can be very large for a big dataset",
    "Reproducibility holds only when replaying the manifest, not when re-running the same pipeline from scratch",
    "Makes a performance artefact part of a delivered result's identity",
]
rejection_reason = "It weakens the guarantee while appearing to preserve it. A result reproducible only by replaying a recorded partitioning is not reproducible from its inputs, so an independent party repeating the pipeline as specified would get different bytes — which is the situation bit-identity exists to exclude. It also makes an interaction-derived performance artefact part of what a delivered result *is*."

[[content.alternatives]]
text = "Fixed partitioning everywhere: no adaptation for any purpose"
status = "rejected"
pros = [
    "One mechanism, no regime boundary, nothing that can leak into a committed run",
    "Simplest possible cache, and trivially consistent with every determinism obligation",
]
cons = [
    "Forgoes a real interactive win where determinism was never required",
    "Repeatedly re-fetching small fixed nodes while orbiting one area is measurably worse for the user",
]
rejection_reason = "It gives up a benefit that costs nothing to take. Render state is already derived and non-authoritative, and previews are already released from reproducibility, so adaptation there cannot affect any guarantee. Refusing it would be strictness applied where there is nothing to protect."
