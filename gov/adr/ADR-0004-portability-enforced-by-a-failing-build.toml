#:schema ../schema/adr.schema.json

[govctl]
id = "ADR-0004"
title = "Portability enforced by a failing build"
status = "accepted"
date = "2026-07-29"
refs = [
    "RFC-0001:C-LICENSE",
    "RFC-0004:C-HOST",
    "RFC-0004:C-PORT-GATE",
    "RFC-0006:C-RENDER",
]

[content]
context = """
A browser-delivered Strider was raised and then explicitly placed out of scope for the first release,
with the instruction that the architecture should nonetheless be built with it in mind — the example
given being a virtual filesystem so spill could target browser-resident storage rather than a disk.

This is the standard shape of a request that usually fails. "Architect with it in mind" describes an
intention, and intentions about portability do not survive deadlines. Direct filesystem calls, spawned
threads and blocking reads are each locally the simplest correct choice, and collectively are removed
only by revisiting every call site. A codebase written with browser portability in mind but never
compiled for a browser is portable for about three weeks.

The specific incompatibilities are known and unusually concrete. A browser page has no filesystem, so
spill needs a keyed store with no directories and no in-place modification. Threads require conditions
frequently unavailable, so parallelism cannot be assumed. The main thread cannot block, so any blocking
call forecloses the environment outright rather than degrading in it. Byte retrieval is request-shaped
rather than handle-shaped, so a seekable-stream abstraction cannot be implemented at all.

Two of these turned out not to be browser concessions at all, which changed how much the portability
constraint was actually costing. Non-blocking is owed to [[RFC-0006:C-RENDER]] 2 regardless of target, for the
reason [[RFC-0004:C-HOST]] 4's rationale gives. And requiring correctness under a single-threaded executor
makes every operator deterministically testable without a thread pool. So two of the four constraints are
things a desktop-only project should have adopted anyway, and the browser only forced them earlier.

The genuine question was therefore not whether to preserve portability but what would keep the
preservation honest without building the deployment that is out of scope."""
decision = """
Library crates obtain every environment capability from their caller, and a compile target enforces it.
No browser deployment is built. The obligations are written in [[RFC-0004:C-HOST]] and
[[RFC-0004:C-PORT-GATE]]; this ADR records only *why*.

Why interfaces shaped by the **weakest plausible backend** rather than the most convenient:

- **The weak backend is the one that defines the shape**, which is the premise [[RFC-0004:C-HOST]] opens
  with. Stated as a decision rather than as a rule: the alternative was to design for the desktop and adapt,
  and it is rejected because adapting an interface that assumes paths or mutation is a redesign of every
  caller, not a port. The cost is that desktop code cannot use the facilities its platform has.
- **Explicit offset-and-length, not a seekable handle**, for the reasons [[RFC-0004:C-HOST]] 2's rationale
  sets out. What is decided here is that the range interface is the *only* one, with no seekable variant
  offered where a platform could support it — a second interface would be a second thing to keep portable,
  and the range form is not merely adequate but better on the cache path.

Why two of the constraints are **not concessions at all**: non-blocking is independently required by
[[RFC-0006:C-RENDER]] (2), since a blocked thread cannot observe a cancellation. Single-threaded
correctness makes every operator deterministically testable without a thread pool and turns a class of
concurrency bug into a reproducible failure.

Why a **compile target** rather than a documented convention: this is the substance of the decision.
Filesystem calls, spawned threads and blocking reads are the path of least resistance in every
language, and a stated intention decays under any deadline. A build that fails is not negotiable and
names the file. Why the check runs on *every* change rather than periodically is [[RFC-0004:C-PORT-GATE]] 3's
own argument; what belongs here is that a per-change gate is only affordable because the gate is a compile
target, which costs seconds, rather than a test suite for a deployment nobody is building.

Why **two gates, not one**: compiling for a constrained target was expected to be sufficient and is
not. A probe calling `std::fs::read` and `std::thread::spawn` compiles cleanly for
`wasm32-unknown-unknown`, whose standard library stubs both rather than omitting them — so the build
gate would have passed a crate that cannot actually run there. A lint rejecting ambient-capability
references is therefore required alongside it ([[RFC-0004:C-PORT-GATE]] 2). The two are
complementary: the target catches a *dependency* that cannot build for a constrained host at all,
the lint catches a *call* the stubbed standard library would happily compile.

Why **compile-time and lint-time only**: the obligation is that the code contains no environment
assumption, which these two checks together establish. A browser test suite, a deployment, and environment-specific code paths in
library crates all stay out of scope, keeping the cost proportionate to a deferred option."""
consequences = """
### Positive

A browser or server-side deployment becomes a matter of supplying implementations rather than a rewrite,
and one interface covers both since object stores and browser storage share the no-in-place-modification
shape. Every operator is testable against an in-memory store and a single-threaded executor — no temporary
directories, no thread pool — making concurrency defects reproducible. The application controls its own
thread budget instead of each library allocating independently. Caching and request coalescing have an
obvious home, since all retrieval passes through one interface.

### Negative

Capability interfaces must be threaded through library APIs from the beginning, visible in every signature
that reads or writes. Locally simpler synchronous code is unavailable even where it would be adequate, and
contributors must understand why or they will reintroduce direct filesystem calls in good faith.

Memory-mapped I/O is given up inside library crates — a real loss for local reads specifically, since it is
a genuinely good way to read a large local file. Where that cost proves material it is recovered inside a
*desktop implementation* of the retrieval interface, never by exempting a library crate.

### Neutral

Two drifts to watch. First, the residual gap the two gates do not close: a capability interface acquiring a
method only a filesystem can implement would satisfy both the compile target and the lint while defeating
the purpose, and no cheap check detects it. Second, the interfaces growing toward a general virtual
filesystem, when the point is the narrowest surface the weakest backend supports.

Reversal cost is low to abandon and high to retrofit, which is the asymmetry this decision exploits.
Dropping these constraints later costs nothing but a decision. Adding them after the libraries have
adopters would break their public interfaces, and the libraries are permissive under
[[RFC-0001:C-LICENSE]] specifically so that adopters exist."""

[[content.alternatives]]
text = "Abstract host capabilities now — storage, byte retrieval, parallelism — forbid blocking, and enforce all of it with a no-filesystem no-threads compile target in CI, while building no browser deployment"
status = "accepted"
pros = [
    "A failing build target reports each violation at the moment it is introduced, naming the file",
    "Costs almost nothing while code is being written; these are interfaces a layered design wants anyway",
    "Non-blocking and single-threaded correctness are independently required for cancellable rendering and deterministic tests",
    "Compile-only enforcement is cheap: no browser test suite, no deployment, no environment-specific code paths",
    "Keeps a server-side deployment open too, since object stores share the no-in-place-modification shape",
]
cons = [
    "Every library crate must thread capability interfaces through its API surface from the start",
    "Rules out convenient synchronous filesystem code, and memory-mapped I/O, even where adequate",
    "A compile target that is never run can still hide runtime-only incompatibilities",
]

[[content.alternatives]]
text = "Write the desktop implementation directly against the filesystem, threads and blocking I/O, and port later if a browser deployment is actually wanted"
status = "rejected"
pros = [
    "Simplest possible code at every call site",
    "No capability interfaces to design, thread through APIs, or document",
    "No effort spent on a deployment that may never be built",
]
cons = [
    "The port would touch every call site that reads, writes, spawns or blocks — most of the I/O surface",
    "Ambient capabilities leak into public API shapes, so the port becomes a breaking change for adopters",
    "Blocking calls would also violate the cancellable-rendering requirement already established",
]
rejection_reason = "The retrofit cost is not proportional to the code touching the filesystem; it is proportional to the public interfaces shaped by assuming one. Once library APIs hand back seekable handles or spawn their own threads, changing that is a breaking change for every adopter — and the libraries are permissive precisely so adopters exist. Blocking I/O would also contradict [[RFC-0006:C-RENDER]] on the desktop, so this option is not even locally consistent."

[[content.alternatives]]
text = "Build browser support properly in the first release: compile to WebAssembly, ship a browser viewer, treat it as a supported target"
status = "rejected"
pros = [
    "Portability verified by something actually running, not merely compiling",
    "A browser viewer would be a strong demonstration of streaming point cloud access",
]
cons = [
    "Threads in a browser require cross-origin isolation headers, adding a deployment constraint to a desktop project",
    "A second rendering path, build pipeline and test matrix before the first is proven",
    "Doubles the scope of a release whose central claim — out-of-core processing — is still unproven",
]
rejection_reason = "Out of scope by direction, and correctly so. The first release must establish that out-of-core processing works at all; a second delivery target competing for the same effort is the reliable way not to establish it. Compile-only enforcement captures nearly all the architectural benefit at a fraction of the cost and leaves this open for later."
