#:schema ../schema/adr.schema.json

[govctl]
id = "ADR-0006"
title = "Bake as a cache, history as the record"
status = "accepted"
date = "2026-07-29"
refs = [
    "RFC-0002:C-APPROX",
    "RFC-0007:C-BAKE",
    "RFC-0007:C-EDIT",
    "RFC-0007:C-EXTRACT",
    "RFC-0007:C-INVALIDATION",
    "RFC-0007:C-PROVENANCE",
]

[content]
context = """
Bounding the cost of resolving a partition's effective edit set ([[RFC-0007:C-INVALIDATION]] 3) makes
*finding* the edits relevant to a partition cheap, but not *applying* them. A heavily corrected stand accumulates deep chains over the
same partitions, so evaluation cost still grows with the work done there. Consolidation is therefore
unavoidable rather than an optimisation.

Graphite faces the same accumulation and answers it with caching plus JIT compilation, which its own
reporting describes as on hold pending Rust toolchain development. There is no borrowable fix, so this
had to be decided independently.

Two questions were entangled and needed separating.

The first is who triggers consolidation. An explicit "flatten history" command is predictable and
inspectable, and will not be run: the observable symptom is a workbench that gets slower over a day's
work, and nothing connects that experience to a menu item the user has no reason to visit. Transparent
consolidation behaves like every other cache and requires the guarantee that it cannot change results,
since it happens on a threshold the user cannot see.

The second is whether consolidation may *discard* what it consolidates, and this turned out not to be
a performance question at all. A manual reclassification can change a timber volume estimate, and such
estimates are acted on commercially and sometimes contractually. "Who changed what, and when" is then
a question about the output's validity, not an undo convenience — and an output looks equally
authoritative whether or not a human intervened in producing it, which is precisely why the record
cannot be left to procedure.

The cost asymmetry is decisive. The stack is already an ordered sequence of roughly kilobyte records
([[RFC-0007:C-EDIT]] 2), so retaining superseded ones costs almost nothing. Reconstructing a history
that was never kept costs everything, and the loss is silent — nobody discovers a missing audit trail
until they need it."""
decision = """
Consolidation is transparent and affects only the executable representation; recorded history is
append-only and never collapsed. The obligations are written in [[RFC-0007:C-BAKE]] and
[[RFC-0007:C-PROVENANCE]]; this ADR records only *why*.

Why **transparent** rather than user-invoked:

- **A cache requiring manual invalidation is not a cache.** An explicit flatten command is predictable
  and will not be run. What the user experiences instead is a workbench that degrades over a session,
  with nothing connecting the symptom to the remedy.
- **Safety comes from a guarantee, not from asking.** Because baking cannot change results
  ([[RFC-0007:C-BAKE]] 2), running it unasked is safe. Without that guarantee, automatic consolidation
  would mean silently altering output on a threshold the user cannot see — so the guarantee is what
  licenses the automation.
- **Re-derivable and discardable makes it a cache rather than a second truth.** A bake defect is
  repaired by deletion, and a corrupted bake cannot destroy work.

Why history is **append-only**, which is a data-retention decision rather than a performance one:

- **The output is acted on.** A manual reclassification can move a timber volume estimate, and such
  estimates carry commercial and sometimes contractual weight. Whether a human intervened is then a
  question about the result's validity.
- **The two are asymmetric in cost.** Edits are already small ordered records, so keeping superseded
  ones is nearly free; reconstructing a history never kept is impossible, and the loss is discovered
  only when it matters.
- **Undo and provenance are different requirements.** Undo needs only to reach the previous state.
  Provenance needs the record that an intermediate state existed and was rejected, which is frequently
  the interesting part of an audit.
- **It is the same principle as [[RFC-0002:C-APPROX]], one level up.** There, an approximation must not
  be presented as exact. Here, a manual intervention must not vanish. In both cases the output looks
  equally authoritative either way, so the discipline has to be structural.

The two decisions compose because they are about different stores: history is authoritative for what
happened, the baked form is a projection maintained for speed. That is the same authority split as
[[RFC-0007:C-EXTRACT]] applies between document and render state, one level down."""
consequences = """
### Positive

A long editing session stays fast without the user knowing consolidation exists. A bake defect is
recoverable by deleting the baked form, since it is re-derivable from history alone. Any output can be
attributed to the edits behind it, which makes manual correction defensible to a third party rather than
merely undoable. Undo comes free from a history that already retains superseded edits.

### Negative

Two stores must be kept consistent, with a standing obligation that the baked form is re-derivable from
history. Baking must be shown not to change results — a real proof obligation rather than a code comment —
and it runs unasked, so the cost of being wrong is high. The consolidation threshold is a tuning parameter
with no obviously correct value, and [[RFC-0007:C-BAKE]] 1 additionally requires it to be observable.

History grows without bound, including edits that were undone, and there is deliberately **no**
space-reclamation story for it.

### Neutral

The unbounded growth is linear in user actions rather than in data size, and the records are small — so
whether it reads as a cost depends on session length rather than dataset size. Any future pressure to
reclaim that space is pressure against [[RFC-0007:C-PROVENANCE]] 3, and should be recognised as such
rather than treated as housekeeping.

Two erosions to watch. First, erosion by degrees: no individual cache eviction looks like discarding an
audit trail, which is exactly how audit trails get discarded, and it is why that clause names the
mechanisms rather than stating a principle. Second, the baked form being treated as authoritative because
it is the one being read — the moment anything is recovered from a bake that could not be re-derived from
history, the split has already failed.

Reversal cost is asymmetric in the usual direction. Dropping append-only history later is easy and
irreversible; adding it later is impossible. Making bake explicit later is straightforward, since it would
only mean not running automatically."""

[[content.alternatives]]
text = "Transparent bake of the executable representation over an append-only history that is never collapsed"
status = "accepted"
pros = [
    "Consolidation happens without the user knowing to ask, which is the only way it happens at all",
    "History costs almost nothing to keep, since edits are already small ordered records",
    "A baked form that is re-derivable and discardable is a cache, so a bake bug is fixed by deletion",
    "Provenance survives: an output remains attributable to the edits that produced it",
    "Separates the two concerns cleanly — history is authoritative, the baked form is a projection",
]
cons = [
    "Two stores to keep consistent, with a re-derivability obligation between them",
    "History grows without bound, including edits that were undone",
    "Requires proving bake cannot change results, since it runs unasked",
]

[[content.alternatives]]
text = "Explicit user-invoked flatten, which collapses history as it consolidates"
status = "rejected"
pros = [
    "Predictable: consolidation happens only when asked, and its cost is visible",
    "One store, bounded in size, with nothing to keep consistent",
    "Simplest possible implementation",
]
cons = [
    "Users will not run it, and will experience only a workbench that degrades over a session",
    "Collapsing history destroys the audit trail irreversibly",
    "Nothing connects the slowdown to the remedy, so the symptom presents as a performance defect",
]
rejection_reason = "A cache that requires manual invalidation is not a cache. The predictable outcome is support reports about slow files from users who had no reason to visit a flatten command, and the collapse is irreversible — so the first time anyone needs to explain how a volume estimate was produced, the answer has already been discarded."

[[content.alternatives]]
text = "Transparent bake that collapses history as it consolidates, keeping only bounded undo state"
status = "rejected"
pros = [
    "Consolidation is automatic and storage stays bounded",
    "One store, no re-derivability obligation, no consistency to maintain",
    "Matches how most editors treat undo history",
]
cons = [
    "The audit trail is destroyed silently, by a threshold the user cannot see",
    "An output can no longer be attributed to the manual interventions behind it",
    "Impossible to add retroactively — history not kept cannot be reconstructed",
]
rejection_reason = "It makes the system quietly discard the record of human intervention in results that are acted on commercially. Retaining that record is nearly free given how small edit records are, and adding it later is impossible, so the cheap option is also the one that forecloses the least."

[[content.alternatives]]
text = "No consolidation: evaluate the full edit stack on every partition read"
status = "rejected"
pros = [
    "One representation, trivially always correct, nothing to invalidate",
    "History is inherently complete because nothing is ever collapsed",
]
cons = [
    "Evaluation cost grows without bound in exactly the regions the user worked hardest on",
    "A file becomes progressively slower to open as manual correction accumulates",
]
rejection_reason = "The cost lands precisely where the user invested the most effort, which is the worst possible distribution. It is also the failure mode any naive edit log has, and avoiding it is why consolidation exists."
