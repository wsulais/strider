#:schema ../schema/adr.schema.json

[govctl]
id = "ADR-0016"
title = "A composed halo, or an exchange, but never each operator's own width alone"
status = "proposed"
date = "2026-07-31"
refs = [
    "ADR-0015",
    "RFC-0002:C-APPROX",
    "RFC-0002:C-COMPOSITION",
    "RFC-0002:C-EXEC",
    "RFC-0002:C-HALO",
    "RFC-0002:C-MEMORY",
    "RFC-0003:C-COMMIT",
]

[content]
context = """
[[RFC-0002:C-HALO]] 3 holds each operator to a halo width sufficient "for its own neighbourhood definition".
A prototype measured what happens to a *chain* of such operators when a planner satisfies each declaration
individually — which is the obvious reading, and the one an implementation reaches first.

Three rounds of a neighbourhood operator at radius r, over four partitions, each arrangement compared against
the same chain computed with the whole cloud in one partition:

| arrangement | halo constructions | barriers | rows processed | points wrong | worst error |
|---|---|---|---|---|---|
| exchange between rounds, width r | 12 | 2 | 7329 | 0 | 8.3e-17 |
| one halo, width r | 4 | 0 | 7329 | **188** | 5.3e-3 |
| one halo, width 2r | 4 | 0 | 8586 | **17** | 2.2e-4 |
| one halo, width 3r | 4 | 0 | 10203 | 0 | 8.3e-17 |

The middle two rows are the finding. Supplying each operator the width it declared, over one borrowed halo,
is wrong — and wrong silently, with no operator in breach of anything. A halo point's value after the first
operator was computed from a truncated neighbourhood, so the error walks inward one width per operator and the
exact region shrinks until it no longer covers the core.

Two arrangements are exact. Borrowing the sum of the declared widths once needs no synchronisation and
processes 39% more rows, because a wider halo means every partition recomputes values for points another
partition owns. Exchanging the halo between operators keeps the narrow width and processes fewer rows, at the
cost of three times the halo constructions and a barrier per step — every partition must finish an operator
before any starts the next.

The sum is computable before anything runs, because [[RFC-0002:C-EXEC]] 1 already requires every operator to
declare its halo width. That is what makes this a planner obligation rather than an operator one: a component
seeing one operator at a time has the information for neither arrangement.

Two limits on the evidence belong here rather than being left implied. The measurement ran one configuration —
2000 synthetic points, four partitions, one operator repeated three times at a single radius — so
heterogeneous widths and varying partition sizes are sound by the arithmetic but were not exercised. And the
exact rows agree to 8.3e-17 under a 1e-12 tolerance rather than bit-identically, because a partitioned run
accumulates in a different order from the single-partition reference."""
decision = """
A dependent chain is evaluated either by one composed halo of at least the sum of the declared widths, or by
exchanging the halo between operators — and never by supplying each operator its own width without an
exchange. The obligations are written in [[RFC-0002:C-COMPOSITION]]; this ADR records only *why*.

Why **the sum** and not the largest declaration: the widths compose. Each operator consumes a border of
validity that the previous one produced, so a chain's reach is additive even though no single operator's is.
The largest declaration is exactly the value that looks right and measures wrong.

Why **both arrangements are permitted** rather than one being fixed: both are exact, and which is cheaper
depends on the pipeline. A wide halo trades synchronisation for redundant computation; an exchange trades
redundant computation for synchronisation and for intermediate state. Fixing either would be a performance
judgement made once, in a specification, on behalf of workloads nobody has measured — and the evidence covers
one shape. What the clause fixes instead is that the choice be made deliberately and recorded, and that the
third arrangement is unavailable.

Why the third arrangement is **named** in the obligation rather than left to follow from the sum rule: it is
what an implementation does by default. Every operator declares a width, the planner satisfies each
declaration, and the result passes every check that existed before this clause. Naming it is the difference
between a rule that is followed and a rule that is discovered after a delivered figure turns out wrong along
the tile seams.

Why a **separate clause**: it binds a component that sees the whole pipeline, where [[RFC-0002:C-HALO]] binds
operators and the stage assembling a batch. Putting it in [[RFC-0002:C-HALO]] would have made an assessor read
a clause
about neighbourhoods to find an obligation about scheduling.

One consequence for [[RFC-0002:C-HALO]] 1 had to be faced rather than worked around. Its prohibition on an
operator emitting halo points, read literally, forbids the composed-halo arrangement outright — a chain needs
the halo to survive between operators. The layout [[ADR-0015]] fixed — core points first — is what makes the trim after the last
operator cheap, so the composed arrangement inherits it unchanged. The rule that actually prevents
duplication is *never relabel a halo
point as a core point*, so that is what [[RFC-0002:C-HALO]] 1 now says, with the halo removed before any operation
depending on disjointness and before the pipeline's output."""
consequences = """
### Positive

The silent failure is closed, and closed by a check that can fail: [[RFC-0002:C-COMPOSITION]] 6 requires a
below-composed case that still satisfies every individual declaration, which is precisely the arrangement this
decision forbids. Both exact arrangements remain available, so a planner chooses by measurement rather than by
specification. The rule needs no new declaration surface — [[RFC-0002:C-EXEC]] 1 already carries every width
the sum requires.

### Negative

Chains get more expensive, in one of two ways, and no arrangement avoids both. The composed halo processed 39%
more rows at three operators, and that grows with chain length; the exchange arrangement holds every
partition's intermediate output between operators, which is whole-dataset state and has to be spilled. A
pipeline that was previously fast and wrong becomes slower and right, and the slowdown is visible where the
wrongness was not — which is the shape of complaint this decision invites.

It also constrains what may be composed. An operator that cannot bound its neighbourhood — a k-nearest
operator over unknown density — contributes an unbounded term to the sum, so it cannot appear in a dependent
chain evaluated by composed halo at all. [[RFC-0002:C-HALO]] 3 admits such an operator alone, on the terms
that it declares its output approximate; this decision denies it a place in a chain, which is a real reduction
in what the operator set can express.

The memory ceiling is now reachable from a new direction. Nothing bounds chain length, so a long enough chain
has a composed width exceeding the partition extent, at which point [[RFC-0002:C-MEMORY]] 1's independence
from total point count fails. [[RFC-0002:C-COMPOSITION]] 4 answers with a rejection, which means some
pipelines a user can write are pipelines the planner must refuse — and that refusal names a width rather than
an operator, which [[RFC-0002:C-EXEC]] 2's diagnostic form does not anticipate.

And [[RFC-0002:C-HALO]] 1 has been weakened to make this possible. "An operator MUST NOT emit halo points" was
a rule with one clear reading; "MUST NOT relabel, and MAY carry forward only into another halo operator of the
same pipeline" is a rule with a condition, and conditions are where implementations differ.

### Neutral

Nothing here changes a single operator's obligations. [[RFC-0002:C-HALO]] 3 and 4 are untouched, and a
pipeline with one neighbourhood operator is unaffected in every respect.

The decision is independent of which component performs the relational work downstream. It constrains what a
planner supplies to a chain, not what happens to the chain's disjoint output.

Reversal cost is low in the intended direction and high in the other. Adding a third permitted arrangement
later, or fixing one of the two, is a clause bump against a rule already being followed. Removing the
obligation after pipelines have been evaluated under it means every result a chain produced becomes of unknown
validity, because the arrangement recorded alongside it would no longer imply anything about its halo. That
asymmetry is why [[RFC-0002:C-COMPOSITION]] 5 requires the arrangement recorded with the result — in the
evaluation configuration [[RFC-0003:C-COMMIT]] 4 already mandates — rather than merely chosen."""

[[content.alternatives]]
text = "Permit exactly two arrangements — one composed halo of at least the sum of declared widths, or an exchange between operators — and require the choice to be recorded"
status = "accepted"
pros = [
    "Both arrangements measured exact: 0 points wrong against a single-partition reference",
    "Forbids the arrangement measured wrong (188 of 2000 points at width r over three operators), which is also the one an implementation reaches by default",
    "Needs no new declaration: [[RFC-0002:C-EXEC]] 1 already requires every halo width, so the sum is computable before anything executes",
    "Leaves the cost trade to the planner, where it can be measured, rather than fixing it in a specification from one measured shape",
    "The segment rule admits the mixed arrangement a real implementation converges on — split the chain, exchange between segments",
]
cons = [
    "Two arrangements to implement, verify and record, where one would be simpler",
    "Excludes an unbounded-reach operator from a composed chain, reducing what the operator set can express",
    "Introduces a rejection for chains whose composed width exceeds the memory ceiling, so some writable pipelines must be refused",
    "Required weakening [[RFC-0002:C-HALO]] 1's emit prohibition from a flat rule to a conditional one",
    "The verification needs a deliberately-wrong configuration to run, which is unusual and easy to skip",
]

[[content.alternatives]]
text = "Fix the composed halo as the only arrangement: always borrow the sum, never exchange"
status = "rejected"
pros = [
    "One arrangement to implement, verify and record",
    "No barrier, so partitions stay independent and the executor stays simple",
    "No whole-dataset intermediate state between operators",
]
cons = [
    "Measured 39% more rows processed at three operators, growing with chain length",
    "Reaches the memory ceiling sooner, since the halo width grows with the chain while the exchange arrangement's does not",
    "Makes a performance choice in a specification on the strength of one measured configuration",
]
rejection_reason = "It is probably the arrangement this project would choose most of the time, which is not the same as the arrangement to mandate. The redundant work grows with chain length while the exchange arrangement's does not, so for a long chain over large partitions the ordering reverses — and the measurement covers one shape at one partition size. Fixing it would be a performance judgement disguised as a correctness rule."

[[content.alternatives]]
text = "Fix halo exchange as the only arrangement: each operator gets its declared width, and the halo is re-supplied between operators"
status = "rejected"
pros = [
    "Each operator's declared width is used as declared, so [[RFC-0002:C-HALO]] 3 is the only width rule needed and no sum has to be computed",
    "Processes the fewest rows of any exact arrangement",
    "Matches how the scientific-computing literature has always scheduled halo exchange",
]
cons = [
    "Requires a barrier per step, so partitions cannot be evaluated independently and the slowest partition gates every other",
    "Holds every partition's intermediate output between operators — whole-dataset state, which [[RFC-0002:C-MEMORY]] 1 forbids unless spilled",
    "Measured three times the halo constructions",
]
rejection_reason = "The barrier is the problem, not the cost of the halo. One per operator makes a chain's latency the sum of its slowest partitions rather than of its average, and forces whole-dataset intermediate state through the spill path at every step. For a single-machine v1 that is a worse default than redundant computation — but it is genuinely better for long chains, which is why it stays permitted rather than mandated."

[[content.alternatives]]
text = "Leave [[RFC-0002:C-HALO]] 3 as the only width rule: satisfy each operator's declaration, accept the divergence, and declare the chain's output approximate"
status = "rejected"
pros = [
    "No new obligation, no sum, no arrangement to record, no rejection to implement",
    "Fastest of all: the narrow halo with no exchange processes the fewest rows and needs no barrier",
    "Arguably already conformant, since every operator's declared width is satisfied",
]
cons = [
    "Measured 188 of 2000 points wrong, with a worst error of 5.3e-3, at three operators",
    "The divergence has no bound: it grows with chain length and with the ratio of boundary to interior points, which is the ratio that grows as partitions shrink",
    "[[RFC-0002:C-APPROX]] 1 requires the KIND of divergence to be named, and 'the halo ran out partway through the chain' is a defect rather than a kind",
]
rejection_reason = "This is the status quo the measurement condemns, and disclosing it as approximation would be dishonest rather than merely lossy. [[RFC-0002:C-APPROX]] exists for divergences inherent to a computation — a truncated neighbourhood at a partition edge is one; a truncated neighbourhood because the planner supplied too little halo is a planner defect wearing an approximation's clothes. An unbounded error that worsens as partitions shrink is not a trade-off a user can reason about."
