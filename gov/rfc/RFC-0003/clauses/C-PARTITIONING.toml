#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-PARTITIONING"
title = "Adaptive partitioning"
kind = "normative"
status = "active"

[content]
text = """
A cache that reshapes partitions to match how a user is working is a real optimisation — merging nodes
while the camera orbits one tree, subdividing them for finer working sets. It is also incompatible with
bit-identical results, because partition identity is what fixes reduction order. So it is permitted exactly
where nothing reproducible depends on it, and desirable there.

1. Partitioning used for a committed run MUST be derived only from the source's spatial index and the
   operators' declared requirements.
   - It MUST NOT depend on interaction history, cache state, or camera position.
   - An adapted partitioning MUST NOT be reused for a committed run, including where one is already
     resident.
2. Partitioning used for preview or rendering MAY adapt to access patterns, merging or subdividing freely.
3. A cache MUST NOT subdivide a partition in order to satisfy an operator's neighbourhood requirement.
   - Supplying neighbours is the planner's duty, discharged from the declared halo width
     ([[RFC-0002:C-EXEC]] 1 and [[RFC-0002:C-HALO]] 3).
4. A partitioning MAY be established over coordinates expressed in a frame related to the source's frame by
   an isometry, where that frame is fixed before any run over the source and recorded with it.
   - The frame MUST share the source's datum. Adopting a frame that changes the datum is a **datum
     transformation** and is governed by [[RFC-0005:C-BACKEND]] 2 rather than by this item, whether or not
     the transformation itself is an isometry.
   - The isometry MUST be recorded in the source's own declaration of its coordinate reference system
     ([[RFC-0005:C-CRS]] 1). Leaving it implicit MUST NOT be treated as satisfying this.
   - This item permits a *partitioning* to be established over coordinates already expressed in such a
     frame. Re-expressing coordinates in one is a transformation of point coordinates and remains governed
     by [[RFC-0005:C-TRANSFORM]] 3; this item does not license doing so outside an explicit operator.
   - One frame SHOULD serve a whole partitioning rather than a separate frame per partition.

#### Rationale

(1) is entailed by C-COMMIT 3, C-COMMIT 4 and [[RFC-0005:C-BINDING]] 5 taken together — reduction order
fixed by partition identity, a recorded partition size, and a fingerprint on every derived artefact. An
adaptive partitioning satisfies none of the three. The nested prohibition on *reuse* is stated separately
because entailment does not stop an already-warm adapted partitioning from being picked up, which is the
concrete way this is violated in practice.

(2) is not merely tolerated but wanted, and it is licensed by the same split that governs everything else:
render state is derived and never authoritative ([[RFC-0007:C-EXTRACT]] 1 and 2), and previews are already
released from reproducibility by C-PREVIEW 2. Nothing repeatable depends on the shape of a render
partition, so the cache may do whatever serves the interaction.

(3) is stated as a prohibition on the *cache* rather than as a restatement of the planner's duty, which
[[RFC-0002:C-HALO]] already owns. The point is that a second, non-deterministic mechanism for supplying
neighbours must not appear alongside the deterministic one.

(4) is a permission rather than a requirement because nothing in this specification required a partition's
bounds to be axis-aligned, so a rule mandating them would have added constraint rather than recorded
practice. What needed writing was not the permission but the **recording**, which is why that is the only MUST
here: coordinates in an unrecorded frame are indistinguishable from coordinates in the source's frame, so a
consumer places the data confidently in the wrong location, which is the hazard [[RFC-0005:C-CRS]] 3 refuses
for an absent system arriving by another route.

Its three conditions each answer a clause this item would otherwise contradict. *Fixed before any run and
recorded with the source* is what satisfies (1): a frame chosen at run time from the data is derived from
neither the source's spatial index nor the operators' declarations, while a frame recorded with the source is
part of how the source describes its coordinates. *Recorded in the source's own declaration* is what makes the
recording achievable, since composing a coordinate reference system is not open to a library crate that must
treat one as opaque ([[RFC-0005:C-CRS]] 2). And confining the item to where a partitioning may be
*established* leaves moving points to [[RFC-0005:C-TRANSFORM]] 3, which is its subject.

The datum condition exists because [[RFC-0005:C-BACKEND]] 2's gate cannot be decided from the form of the
transformation — a three-parameter datum shift is itself an isometry. What decides it is whether the datum
changes.

Why an isometry rather than a general transformation, why one frame rather than a frame per partition, and what
this item deliberately leaves unsettled about the shape of a bounding volume, are comparative questions argued
in the accompanying architecture decision."""
