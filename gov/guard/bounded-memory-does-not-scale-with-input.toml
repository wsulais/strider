#:schema ../schema/guard.schema.json

[govctl]
id = "GUARD-BOUNDED-MEMORY-DOES-NOT-SCALE-WITH-INPUT"
title = "bounded memory does not scale with input"
refs = [
    "RFC-0001:C-CONFORMANCE",
    "RFC-0002:C-MEMORY",
]

# [[RFC-0002:C-MEMORY]] 6 extends this to a pipeline that delegates part of its
# evaluation: the two-size measurement must cover the WHOLE evaluation, including the
# delegated part. Measuring the registered operators alone leaves the ceiling set by
# something no item reaches.
[check]
command = "devenv shell -- cargo test --release --test conformance_memory -- --ignored --nocapture"
timeout_secs = 3600
