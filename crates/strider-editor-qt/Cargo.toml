# The Qt editor.
#
# The platform suffix is the point: `strider-editor-qt` names one front end, so a second — a web
# one — is a sibling rather than a rewrite. What makes that credible is what sits *below* it:
# `strider-view` renders, `strider-doc` holds the document model, and both are permissive and
# toolkit-free. This crate is the only place Qt is allowed to exist
# ([[RFC-0006:C-TOOLKIT]] 1, [[ADR-0009]]).
[package]
name = "strider-editor-qt"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
# Application, NOT a library — AGPL-3.0-or-later per [[RFC-0001:C-LICENSE]] 2, declared here
# rather than inherited from [workspace.package].
license = "AGPL-3.0-or-later"
repository.workspace = true
description = "The Strider editor, on Qt"

[dependencies]
strider-view = { path = "../strider-view" }
strider-view-wgpu = { path = "../strider-view/wgpu" }
strider-doc = { path = "../strider-doc" }
strider-io = { path = "../strider-io" }
arrow = { version = "58", default-features = false }

# The toolkit. Admissible here and nowhere beneath: Qt's licensing is why [[ADR-0009]] puts it in
# the application, and `GUARD-NO-TOOLKIT-UNDER-LIBRARY-CRATES` checks the rest of the tree.
cxx = "1"
cxx-qt = "0.9"
cxx-qt-lib = { version = "0.9", features = ["qt_gui", "qt_qml"] }

[build-dependencies]
cxx-qt-build = { version = "0.9", features = ["link_qt_object_files"] }

[lints]
workspace = true
