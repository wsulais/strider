# The renderer: the part with no device, no toolkit and no clock.
#
# Not a facade. `strider-io` is one because it picks a **default among interchangeable peers** —
# copc today, parquet and e57 later — and that choice has to live somewhere. There is no such
# choice here: one renderer, and backends that depend on it. A namespace crate wrapping a single
# thing is indirection with a rule attached, so the parent *is* the renderer and
# `strider-view-wgpu` sits beneath it rather than beside it behind a feature.
#
# That also keeps `#![no_std]` unconditional. Were the optional GPU dependency declared here,
# enabling it would force `cfg_attr(not(feature = "wgpu"), no_std)`, and a `no_std` that switches
# off is not the guarantee this crate is for.
[package]
name = "strider-view"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
# Library crate — permissive per [[RFC-0001:C-LICENSE]] (1).
license.workspace = true
repository.workspace = true
description = "The renderer as a pure step function: no device, no toolkit, no clock"

# Deliberately empty, and two guards depend on it staying that way.
#
# GUARD-NO-TOOLKIT-UNDER-LIBRARY-CRATES and GUARD-NO-QUERY-ENGINE-UNDER-CORE both walk
# `cargo tree -p strider-view`. With nothing here that tree is a single node, so neither a
# toolkit nor a query engine can be under it — checked against emptiness rather than against a
# dependency that happens to be clean today.
[dependencies]

[lints]
workspace = true
